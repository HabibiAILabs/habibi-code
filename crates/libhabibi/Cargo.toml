[package]
name = "libhabibi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio.workspace = true
tokio-util.workspace = true
base64 = "0.23"
futures-util = "0.3"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

async-trait = "0.1"

jsonschema = { version = "0.61", default-features = false }

rmcp = { version = "3.10", default-features = false, features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rquickjs = "0.14"
reqwest-mcp = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider"] }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
