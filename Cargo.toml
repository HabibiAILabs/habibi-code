[workspace]
members = ["crates/libhabibi", "crates/habibi"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "process", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
