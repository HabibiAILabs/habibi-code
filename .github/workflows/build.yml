name: Build and test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      CARGO_TERM_COLOR: always
      HABIBI_NO_UPDATE_CHECK: '1'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust and native musl compiler
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add "$TARGET"
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: python3 scripts/test_install.py
      - name: Build distribution binary
        run: cargo build --locked --release -p habibi --target "$TARGET"
      - name: Check binary
        run: target/"$TARGET"/release/habibi --version
      - name: Linux terminal smoke test
        if: runner.os == 'Linux'
        run: python3 scripts/smoke.py target/"$TARGET"/release/habibi
      - name: Package
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "habibi"))')
          mkdir -p dist stage
          cp "target/$TARGET/release/habibi" README.md stage/
          tar -czf "dist/habibi-v$VERSION-$TARGET.tar.gz" -C stage habibi README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: habibi-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
