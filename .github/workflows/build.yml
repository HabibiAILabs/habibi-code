name: Build and test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      CARGO_TERM_COLOR: always
      HABIBI_NO_UPDATE_CHECK: '1'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust and native musl compiler
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add "$TARGET"
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: python3 scripts/test_install.py
      - run: python3 scripts/test_release_artifacts.py
      - name: Build distribution binary
        run: cargo build --locked --release -p habibi --target "$TARGET"
      - name: Check binary version matches the workspace
        shell: bash
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$(target/"$TARGET"/release/habibi --version)" = "habibi $VERSION"
      - name: Linux terminal smoke test
        if: runner.os == 'Linux'
        run: python3 scripts/smoke.py target/"$TARGET"/release/habibi
      - name: Program resume protocol test
        run: python3 scripts/test_program_resume.py target/"$TARGET"/release/habibi
      - name: Package
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "habibi"))')
          mkdir -p dist stage
          cp "target/$TARGET/release/habibi" README.md stage/
          mkdir -p stage/docs
          cp docs/pi-secure-LICENSE stage/docs/
          tar -czf "dist/habibi-v$VERSION-$TARGET.tar.gz" -C stage habibi README.md docs/pi-secure-LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: habibi-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 30
