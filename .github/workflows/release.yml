name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.artifacts.outputs.run_id }}
      artifact_ids: ${{ steps.artifacts.outputs.artifact_ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select tested artifacts for this exact release commit
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_artifacts.py select --tag "$TAG"
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.run_id }}
          artifact-ids: ${{ needs.validate.outputs.artifact_ids }}
          digest-mismatch: error
          merge-multiple: true
          path: dist
      - name: Verify all archives and write checksums
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 scripts/release_artifacts.py verify --tag "$TAG"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cp scripts/install.sh dist/install.sh
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to replace a published release"'
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "Habibi $TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release edit "$TAG" --draft=false --latest
